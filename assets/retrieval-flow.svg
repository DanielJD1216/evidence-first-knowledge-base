<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Evidence retrieval flow</title><desc id="desc">A question passes authorization, hybrid retrieval, reciprocal rank fusion, local reranking, a relevance gate, and citation construction before an answer is allowed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10172c"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1e293b" opacity=".42"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#38bdf8"/></marker>
    <style>.h{font:700 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}.sub{font:400 15px Inter,Segoe UI,sans-serif;fill:#94a3b8}.num{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1px}.t{font:700 16px Inter,Segoe UI,sans-serif;fill:#f8fafc}.s{font:400 12px Inter,Segoe UI,sans-serif;fill:#94a3b8}.line{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/><rect width="1600" height="620" fill="url(#grid)"/>
  <text x="70" y="70" class="h">The answer is the last step, not the first</text><text x="70" y="100" class="sub">Every response must survive authorization, retrieval, ranking, and evidence gates</text>
  <path class="line" d="M235 307H285"/><path class="line" d="M465 307H515"/><path class="line" d="M695 307H745"/><path class="line" d="M925 307H975"/><path class="line" d="M1155 307H1205"/><path class="line" d="M1385 307H1435"/>
  <g><rect x="55" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="80" y="246" class="num" fill="#38bdf8">01</text><text x="80" y="284" class="t">Question</text><text x="80" y="315" class="s">User intent</text><text x="80" y="338" class="s">Requested scope</text><text x="80" y="361" class="s">Query identity</text></g>
  <g><rect x="285" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="310" y="246" class="num" fill="#fb7185">02</text><text x="310" y="284" class="t">Authorize</text><text x="310" y="315" class="s">Login entitlement</text><text x="310" y="338" class="s">Project boundary</text><text x="310" y="361" class="s">Fail closed</text></g>
  <g><rect x="515" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="540" y="246" class="num" fill="#a78bfa">03</text><text x="540" y="284" class="t">Retrieve</text><text x="540" y="315" class="s">Full text</text><text x="540" y="338" class="s">Vector search</text><text x="540" y="361" class="s">Freshness signals</text></g>
  <g><rect x="745" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="770" y="246" class="num" fill="#34d399">04</text><text x="770" y="284" class="t">Fuse</text><text x="770" y="315" class="s">Reciprocal ranks</text><text x="770" y="338" class="s">Stable tie breaks</text><text x="770" y="361" class="s">Candidate set</text></g>
  <g><rect x="975" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="1000" y="246" class="num" fill="#f59e0b">05</text><text x="1000" y="284" class="t">Rerank</text><text x="1000" y="315" class="s">Local cross-encoder</text><text x="1000" y="338" class="s">Relevance score</text><text x="1000" y="361" class="s">Evidence ordering</text></g>
  <g><rect x="1205" y="210" width="180" height="194" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="1230" y="246" class="num" fill="#fb7185">06</text><text x="1230" y="284" class="t">Gate</text><text x="1230" y="315" class="s">Minimum relevance</text><text x="1230" y="338" class="s">Abstain when weak</text><text x="1230" y="361" class="s">No invented support</text></g>
  <g><rect x="1435" y="210" width="110" height="194" rx="18" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><text x="1460" y="246" class="num" fill="#38bdf8">07</text><text x="1460" y="284" class="t">Cite</text><text x="1460" y="315" class="s">Answer</text><text x="1460" y="338" class="s">Locator</text><text x="1460" y="361" class="s">Evidence</text></g>
  <rect x="55" y="478" width="1490" height="72" rx="18" fill="#0f172a" stroke="#334155"/><text x="80" y="510" class="t">Core invariant</text><text x="215" y="510" class="sub">No authorized evidence means no grounded answer. The system abstains instead of filling gaps.</text><text x="80" y="536" class="s">Optional synthesis occurs only after this pipeline and only inside an approved privacy boundary.</text>
</svg>
